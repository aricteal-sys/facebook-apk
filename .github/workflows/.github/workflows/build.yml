name: Build Facebook APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing key
        run: |
          keytool -genkey -v \
            -keystore app/release-key.jks \
            -storepass android \
            -alias fbkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Facebook, OU=Dev, O=FB, L=NA, ST=NA, C=US"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Facebook_v350.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-APK
          path: Facebook_v350.apk
